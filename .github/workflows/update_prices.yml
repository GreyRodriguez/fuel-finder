name: Weekly Fuel Price Update

on:
  schedule:
    # Runs every Tuesday at 6:00 AM Philippine Time (Monday 10:00 PM UTC)
    - cron: "0 22 * * 1"
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub

jobs:
  update-prices:
    name: Scrape & Update Live Prices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Fuel Price Updater
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python update_prices.py
